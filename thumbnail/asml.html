<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#b3121f;--paper:#ece7dc;--ink:#0b0b0b}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:#0d0d0d}
.c{position:relative;width:1280px;height:720px;overflow:hidden;
 background:radial-gradient(ellipse at 30% 55%,#2a2a2a 0%,#141414 45%,#070707 100%)}
.grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:overlay;pointer-events:none}
.ht{position:absolute;inset:0;background-image:radial-gradient(#fff 1.1px,transparent 1.3px);background-size:7px 7px;opacity:.05}
/* wafer cutout */
.wafer{position:absolute;left:-60px;top:70px;width:640px;height:640px;transform:rotate(-8deg);
 filter:drop-shadow(0 18px 30px rgba(0,0,0,.8))}
/* red beam */
.beam{position:absolute;left:517px;top:-236px;width:70px;height:620px;transform:rotate(24deg);transform-origin:top;
 background:linear-gradient(180deg,rgba(179,18,31,0) 0%,rgba(230,30,45,.85) 70%,#ff4a55 100%);
 filter:blur(3px);mix-blend-mode:screen}
.beamcore{position:absolute;left:546px;top:-236px;width:12px;height:620px;transform:rotate(24deg);transform-origin:top;
 background:linear-gradient(180deg,rgba(255,255,255,0),#fff 92%);filter:blur(1px);mix-blend-mode:screen}
.hit{position:absolute;left:200px;top:230px;width:200px;height:200px;border-radius:50%;
 background:radial-gradient(circle,#fff 0%,#ff5a63 18%,rgba(179,18,31,.6) 40%,rgba(179,18,31,0) 70%);mix-blend-mode:screen}
/* right column */
.frame{position:absolute;left:640px;top:70px;width:590px;height:300px;border:12px solid var(--red);
 box-shadow:0 0 0 3px #000,0 20px 40px rgba(0,0,0,.6)}
.asml{position:absolute;left:640px;top:58px;width:590px;text-align:center;font-family:'Bebas Neue';
 font-size:330px;line-height:330px;color:#fff;letter-spacing:6px;text-shadow:0 8px 0 #000}
.strip{position:absolute;left:610px;top:405px;width:640px;padding:24px 36px 30px;white-space:nowrap;background:var(--paper);color:var(--ink);
 transform:rotate(-2.2deg);font-family:'Oswald';font-weight:700;font-size:104px;line-height:1;text-transform:uppercase;
 clip-path:polygon(0 6%,4% 0,11% 5%,19% 1%,27% 4%,36% 0,45% 5%,55% 1%,63% 4%,72% 0,81% 5%,90% 1%,100% 4%,99% 95%,92% 100%,83% 96%,74% 100%,64% 95%,54% 100%,45% 96%,35% 100%,26% 95%,17% 100%,8% 96%,1% 100%);
 filter:drop-shadow(0 10px 18px rgba(0,0,0,.7))}
.strip span{color:var(--red)}
.stamp{position:absolute;left:60px;top:560px;transform:rotate(-9deg);font-family:'Oswald';font-weight:700;font-size:62px;
 letter-spacing:4px;color:var(--red);background:rgba(10,10,10,.55);border:7px solid var(--red);padding:2px 22px 6px;opacity:.95;
 -webkit-mask-image:radial-gradient(#000 55%,rgba(0,0,0,.55) 100%);text-shadow:0 0 1px var(--red)}
.brand{position:absolute;left:34px;top:26px;font-family:'Bebas Neue';font-size:34px;letter-spacing:5px;color:#fff;opacity:.85}
.brand b{color:var(--red);font-weight:400}
</style></head><body><div class="c">
<div class="ht"></div>

<svg class="wafer" viewBox="0 0 640 640">
 <defs>
  <clipPath id="w"><circle cx="320" cy="320" r="290"/></clipPath>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#d9d9d9"/><stop offset=".45" stop-color="#7d7d7d"/><stop offset=".7" stop-color="#b9b9b9"/><stop offset="1" stop-color="#4a4a4a"/>
  </linearGradient>
  <pattern id="dies" width="34" height="34" patternUnits="userSpaceOnUse">
   <rect x="1.5" y="1.5" width="31" height="31" fill="none" stroke="#2a2a2a" stroke-width="2"/>
   <rect x="7" y="7" width="20" height="20" fill="#000" opacity=".18"/>
   <path d="M7 12h20M7 17h20M7 22h20M12 7v20M17 7v20M22 7v20" stroke="#000" stroke-width=".6" opacity=".35"/>
  </pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.3" fill="#000" opacity=".35"/></pattern>
 </defs>
 <!-- white cutout border -->
 <circle cx="320" cy="320" r="306" fill="#f4f1ea"/>
 <g clip-path="url(#w)">
  <rect width="640" height="640" fill="url(#sh)"/>
  <rect width="640" height="640" fill="url(#dies)"/>
  <rect width="640" height="640" fill="url(#dots)"/>
  <path d="M30 120 L640 -40 L640 60 L30 300Z" fill="#fff" opacity=".25"/>
 </g>
 <circle cx="320" cy="320" r="290" fill="none" stroke="#222" stroke-width="3"/>
</svg>

<div class="beam"></div><div class="beamcore"></div><div class="hit"></div>

<div class="frame"></div>
<div class="asml">ASML</div>
<div class="strip">Без них<br><span>нет чипов</span></div>
<div class="stamp">МОНОПОЛИЯ</div>
<div class="brand">DEEP<b>FRAME</b></div>

<svg class="grain" width="1280" height="720"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div></body></html>
